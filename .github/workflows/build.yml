name: Build
permissions:
  contents: write
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.8.2' }
      - name: Build the mod for every Minecraft version
        run: |
          set -o pipefail
          mkdir -p dist/mods
          for MC in 1.21.11 1.21.9 1.21.8 1.21.1 1.21; do
            Y=$(curl -s https://meta.fabricmc.net/v2/versions/yarn/$MC | jq -r '.[0].version')
            F=$(curl -s "https://api.modrinth.com/v2/project/fabric-api/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%22$MC%22%5D" | jq -r '.[0].version_number')
            echo "== $MC yarn=$Y fabric=$F" | tee -a mod-build.log
            (cd mod && gradle clean build -Pmc=$MC -Pyarn_$MC=$Y -Pfabric_$MC=$F $([ "$MC" != 1.21.11 ] && echo "-x test") --stacktrace) 2>&1 | tee -a mod-build.log
            cp $(ls mod/build/libs/*.jar | grep -v sources) dist/mods/
          done
          ls -la dist/mods
      - name: Build the .jar installer
        run: |
          gradle -p installer-jar build -PmodJars="$PWD/dist/mods" --stacktrace
          cp installer-jar/build/libs/SprinkleClient-Installer.jar dist/
      - name: Jar installer self-test (real Fabric + Modrinth downloads)
        run: |
          set -o pipefail
          java -jar dist/SprinkleClient-Installer.jar --selftest "$RUNNER_TEMP/jartest" 1.21.11 2>&1 | tee jar-selftest.log
          java -jar dist/SprinkleClient-Installer.jar --selftest "$RUNNER_TEMP/jartest121" 1.21.1 2>&1 | tee -a jar-selftest.log
      - name: Save results for review (branch ci-build)
        if: always()
        run: |
          mkdir -p /tmp/res && cp *.log /tmp/res/ 2>/dev/null || true
          cp mod/build/reports/tests/test/index.html /tmp/res/tests.html 2>/dev/null || true
          cd /tmp/res && echo "${{ github.sha }} ${{ job.status }}" > STATUS && git init -q && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-build
      - uses: actions/upload-artifact@v4
        with: { name: SprinkleClient-mod, path: dist/mods/*.jar }
      - uses: actions/upload-artifact@v4
        with: { name: SprinkleClient-Installer-jar, path: dist/SprinkleClient-Installer.jar }

  exe:
    needs: mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - uses: actions/download-artifact@v4
        with: { name: SprinkleClient-mod, path: installer-exe/embed }
      - name: Build the Windows installer
        working-directory: installer-exe
        run: |
          set -o pipefail
          exec > >(tee ../exe-build.log) 2>&1
          go mod tidy
          ls -la embed
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          go install github.com/tc-hib/go-winres@latest
          go-winres make --in winres/winres.json --arch amd64
          mkdir -p ../dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H windowsgui -s -w" -o ../dist/SprinkleClient-Installer.exe .
          GOOS=windows GOARCH=amd64 go build -trimpath -o ../dist/SprinkleClient-selftest.exe .
          ls -la ../dist
      - name: Save results for review (branch ci-exe)
        if: always()
        run: |
          mkdir -p /tmp/res && cp exe-build.log /tmp/res/ 2>/dev/null || true
          cd /tmp/res && echo "${{ github.sha }} ${{ job.status }}" > STATUS && git init -q && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "exe ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-exe
      - uses: actions/upload-artifact@v4
        with: { name: SprinkleClient-Installer-exe, path: dist/*.exe }

  windows:
    needs: exe
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: SprinkleClient-Installer-exe, path: dist }
      - name: Exe installer self-test (real Fabric + Modrinth downloads)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "appdata"
          & .\dist\SprinkleClient-selftest.exe --selftest $dir *>&1 | Tee-Object -FilePath exe-selftest.log
          if ($LASTEXITCODE -ne 0) { throw "installer self-test failed" }
          $env:SPRINKLE_MC = "1.21.1"
          & .\dist\SprinkleClient-selftest.exe --selftest (Join-Path $env:RUNNER_TEMP "appdata121") *>&1 | Tee-Object -FilePath exe-selftest.log -Append
          if ($LASTEXITCODE -ne 0) { throw "installer self-test (1.21.1) failed" }
          Get-ChildItem (Join-Path $dir ".sprinkleclient\mods") | Select-Object Name, Length | Format-Table -AutoSize
      - name: Save results for review (branch ci-windows)
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/res && cp exe-selftest.log /tmp/res/ 2>/dev/null || true
          cd /tmp/res && echo "${{ github.sha }} ${{ job.status }}" > STATUS && git init -q && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "windows ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-windows
