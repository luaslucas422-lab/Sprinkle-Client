name: Test in game
on:
  push:
    branches: [main]
    paths: ['mod/**', '.github/workflows/smoke.yml']
  workflow_dispatch: {}
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.8.2' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri imagemagick >/dev/null
      - name: Make a test world
        working-directory: mod
        run: |
          mkdir -p run && cd run
          echo eula=true > eula.txt
          printf 'level-type=minecraft\\:flat\nonline-mode=false\nspawn-monsters=false\n' > server.properties
          cd ..
          (gradle runServer --args nogui > server.out 2>&1 &)
          for i in $(seq 1 120); do sleep 3; grep -q 'Done (' run/logs/latest.log 2>/dev/null && break; done
          tail -3 run/logs/latest.log || tail -30 server.out
          sleep 5
          pkill -f KnotServer || pkill -f runServer || true
          sleep 5
          gradle --stop || true
          mkdir -p run/saves && cp -r run/world run/saves/smoke
          rm -f run/saves/smoke/session.lock
      - name: Launch the game
        working-directory: mod
        env: { SPRINKLE_SMOKE: '1' }
        run: |
          printf 'onboardAccessibility:false\ntutorialStep:none\nnarrator:0\nsoundCategory_master:0.0\nguiScale:2\n' > run/options.txt
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 1200 gradle runClient > client.out 2>&1 || echo "EXIT $?"
          echo "=====CLIENTLOG"
          grep -nE "SPRINKLE|Sprinkle|sprinkleclient|ERROR|Exception|Caused by|at fr\.darkerdawn|Mixin|crash" run/logs/latest.log | cut -c1-400 | head -150 || true
          echo "=====TAIL"
          tail -15 client.out
          for f in run/crash-reports/*.txt; do [ -f "$f" ] && { echo "=====CRASH"; head -150 "$f"; }; done
          mkdir -p ../shots
          cp run/screenshots/*.png ../shots/ 2>/dev/null || true
          echo "=====END"
          grep -q "SPRINKLE-SMOKE\] done, failures=0" client.out run/logs/latest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: shots/*.png }
