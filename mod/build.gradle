plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.19-SNAPSHOT'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = 'fr.darkerdawn.sprinkle'
base { archivesName = 'SprinkleClient' }

loom {
    runs {
        client {
            if (System.getenv('SPRINKLE_SMOKE')) {
                vmArg '-Dsprinkle.smoke=true'
                programArgs '--quickPlaySingleplayer', 'smoke'
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed'; exceptionFormat 'full' }
}

processResources {
    def props = [version: project.version]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
