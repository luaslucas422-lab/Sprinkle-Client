plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.19-SNAPSHOT'
}

// Multi-version: -Pmc=1.21.9 builds for another Minecraft version.
// Files in versions/<mc>/java replace the file with the same path in src/main/java.
def mc = project.findProperty('mc') ?: project.minecraft_version
def ov = (mc == '1.21') ? '1.21.1' : mc
def overlay = file("versions/${ov}/java")
def overlayRes = file("versions/${ov}/resources")
version = "${project.mod_version}+mc${mc}"
group = 'fr.darkerdawn.sprinkle'
base { archivesName = 'SprinkleClient' }

repositories {
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { name = 'Henkelmax'; url = 'https://maven.maxhenkel.de/repository/public' }
    mavenCentral()
}

loom {
    runs {
        client {
            if (System.getenv('SPRINKLE_SMOKE')) {
                vmArg '-Dsprinkle.smoke=true'
                if (System.getenv('SPRINKLE_TRAILER')) vmArg '-Dsprinkle.trailer=true'
                programArgs '--quickPlaySingleplayer', 'smoke'
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    mappings "net.fabricmc:yarn:${project.findProperty('yarn_' + mc) ?: project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.findProperty('fabric_' + mc) ?: project.fabric_version}"
    // looping main-menu video (pure-Java H.264 decoder), shipped inside our jar
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'org.jcodec:jcodec-javase:0.2.5'
    include 'org.jcodec:jcodec:0.2.5'
    include 'org.jcodec:jcodec-javase:0.2.5'
    // Simple Voice Chat plugin API (only used when Simple Voice Chat is installed)
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.0'

    // only for the in-game test (set by CI): real Mod Menu and Simple Voice Chat
    if (project.hasProperty('modmenu_test')) modLocalRuntime "maven.modrinth:modmenu:${project.modmenu_test}"
    if (project.hasProperty('simple_voice_chat_test')) modLocalRuntime "maven.modrinth:simple-voice-chat:${project.simple_voice_chat_test}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed'; exceptionFormat 'full' }
}

sourceSets.main {
    if (overlay.exists()) {
        java.srcDir overlay
        def replaced = fileTree(overlay).collect { overlay.toPath().relativize(it.toPath()).toString().replace('\\', '/') }
        java.exclude { el -> !el.file.toPath().startsWith(overlay.toPath()) && replaced.contains(el.relativePath.pathString) }
    }
    if (overlayRes.exists()) resources.srcDir overlayRes
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    def props = [version: project.version, mc: mc]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
