plugins { id 'java' }

group = 'fr.darkerdawn.sprinkle'
version = '1.0.0'

repositories { mavenCentral() }

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// The Sprinkle Client mod jar goes inside the installer: -PmodJar=path/to/SprinkleClient.jar
def modJar = project.findProperty('modJar')

processResources {
    if (modJar) {
        from(file(modJar)) { into 'sprinkle'; rename { 'SprinkleClient-mod.jar' } }
    }
}

jar {
    archiveFileName = 'SprinkleClient-Installer.jar'
    manifest { attributes 'Main-Class': 'fr.darkerdawn.sprinkle.installer.Installer' }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/versions/**/module-info.class', 'module-info.class'
}
